spring.application.name=demo

# AWS Region
spring.cloud.aws.region.static=us-east-1

# Custom Queue Property
aws.sqs.analytics-queue=analytics-groceries-queue

spring.datasource.url=jdbc:postgresql://localhost:5433/analytics
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway will look in db/migration by default
spring.flyway.enabled=true

server.port=8082

# Credentials
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
